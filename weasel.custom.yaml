# 小狼毫外观定制（自定义补丁文件）
# 这是 weasel.yaml 的补丁文件，改动不会被升级覆盖。
# 修改后需要「重新部署」才生效：
#   & "D:\Soft\21_rimer_app\weasel-0.17.4\WeaselDeployer.exe" /deploy
#
# 参考：Weasel 定制化 <https://github.com/rime/weasel/wiki/Weasel-定制化>

patch:
  # 隐藏中英文等状态切换提示，避免切换应用时弹出 A / 中 图标。
  show_notifications: false
  style/color_scheme: purity_of_form_custom
  # 候选项竖向排列（从上到下一列的候选框）
  #   false = 竖向列表（当前设置）
  #   true  = 横向候选栏
  style/horizontal: false

  # 英文释义优先：英文 Segoe UI 12pt，中文微软雅黑 UI 9pt，序号 10pt。
  style/font_point: 9
  style/label_font_point: 10
  style/comment_font_point: 12
  style/font_face: "Microsoft YaHei UI"
  style/label_font_face: "Microsoft YaHei UI"
  style/comment_font_face: "Segoe UI, Microsoft YaHei UI"

  # 深灰简洁配色；颜色格式是 0xAABBGGRR，省略 AA 时不透明。
  # 只让背景透底，文字保持不透明；CC / FF 为 80% 不透明。
  "preset_color_schemes/purity_of_form_custom/back_color": 0xCC362A28        # #282A36 Dracula 背景，20% 透明
  "preset_color_schemes/purity_of_form_custom/border_color": 0x48423C        # #3C4248
  "preset_color_schemes/purity_of_form_custom/shadow_color": 0x40000000
  "preset_color_schemes/purity_of_form_custom/text_color": 0xE8EAED          # #EDEAE8
  "preset_color_schemes/purity_of_form_custom/hilited_text_color": 0xFFFFFF
  "preset_color_schemes/purity_of_form_custom/candidate_text_color": 0xC8C0B8 # #B8C0C8
  "preset_color_schemes/purity_of_form_custom/label_color": 0xA29A93         # #939AA2
  "preset_color_schemes/purity_of_form_custom/comment_text_color": 0xC679FF # #FF79C6 Dracula 粉色
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_back_color": 0xA06332 # #3263A0
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_border_color": 0xA06332
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_text_color": 0xE5DAD0 # #D0DAE5
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_label_color": 0xE5DAD0 # #D0DAE5
  "preset_color_schemes/purity_of_form_custom/hilited_comment_text_color": 0xF2F8F8 # #F8F8F2 Dracula 米白色

  # ─────────── 行高与间距 ───────────
  # 行高设为字号的 100%，序号、中文与英文在每条候选行内垂直居中。
  style/layout/linespacing: 100
  style/layout/align_type: center

  # 限制单个文本区域的宽度，长英文按完整单词换行，不截断释义。
  # 整个候选框还包括序号、中文和边距；实际像素大小随系统缩放变化。
  # 保留默认最小宽度，避免短释义前出现大块空白。
  style/layout/max_width: 320

  # 高亮区域上下内边距，缩小每行留白。
  style/layout/hilite_padding_y: 2

  # 候选项之间的间距。
  style/layout/candidate_spacing: 5

  # 序号、候选文字和英文释义之间的横向间隔。
  style/layout/hilite_spacing: 6

  # 候选框整体的上下内边距。
  style/layout/margin_y: 3

  # ─────────── 在特定程序里强制英文模式 ───────────
  # 程序名一律用小写、带 .exe（Weasel 0.15 及更早必须小写，新版本不区分大小写，统一小写最稳）。
  # 作用：只在这些程序里默认英文，其它程序仍是中文默认。
  # 想在这些程序里临时打中文：按 Shift / Ctrl+Space，或 F4 方案选单切到「中」。
  # 写法说明：app_options/<程序名> 只改这一个程序，不会覆盖 base 里已有的其它程序配置。
  app_options/code.exe:            # VS Code
    ascii_mode: true
  app_options/explorer.exe:        # Windows 资源管理器：地址栏、搜索和文件重命名默认英文
    ascii_mode: true
  app_options/uv4.exe:             # Keil µVision 4
    ascii_mode: true
  app_options/windowsterminal.exe: # Windows Terminal —— 从它启动的程序，前台进程是它而不是子进程
    ascii_mode: true               # 例：PowerShell 7 / Git Bash 若从 Windows Terminal 打开，靠这一条生效
  app_options/pwsh.exe:            # PowerShell 7 独立窗口（不经 Windows Terminal 时）
    ascii_mode: true
  app_options/mintty.exe:          # Git Bash 自带的 mintty 窗口
    ascii_mode: true
  app_options/bash.exe:            # 在 conhost / 自建终端里直接跑 bash 时
    ascii_mode: true
  app_options/jflash.exe:
    ascii_mode: true
  app_options/jscope.exe:
    ascii_mode: true
  app_options/jlinkrttviewer.exe:
    ascii_mode: true
  app_options/ozone.exe:
    ascii_mode: true
  app_options/sscomv5131.exe:
    ascii_mode: true
  app_options/dsview.exe:
    ascii_mode: true
  app_options/transcoding.exe:
    ascii_mode: true
  app_options/uedit64.exe:
    ascii_mode: true
  app_options/bcompare.exe:
    ascii_mode: true

  # 以下是按需启用（复制上面任意一段、去掉 # 即可）：
  # app_options/powershell.exe:      # Windows PowerShell 5.1（独立窗口）
  #   ascii_mode: true
  # app_options/wt.exe:
  #   ascii_mode: true
  # app_options/cmd.exe:
  #   ascii_mode: true
  # app_options/nvim-qt.exe:
  #   ascii_mode: true
  #   vim_mode: true                 # vim 模式：Esc / Ctrl+C 自动回到英文
  # 编辑器里可加的小开关（加到上面某个程序下即可）：
  #   vim_mode: true                 # Esc / Ctrl+C 自动切回英文
