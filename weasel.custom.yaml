# 小狼毫外观定制（自定义补丁文件）
# 这是 weasel.yaml 的补丁文件，改动不会被升级覆盖。
# 修改后需要「重新部署」才生效：
#   & "D:\Soft\21_rimer_app\weasel-0.17.4\WeaselDeployer.exe" /deploy
#
# 参考：Weasel 定制化 <https://github.com/rime/weasel/wiki/Weasel-定制化>

patch:
  # 候选项竖向排列（从上到下一列的候选框）
  #   false = 竖向列表（当前设置）
  #   true  = 横向候选栏
  style/horizontal: false

  # ─── 字体与字号 ───
  # 注意单位是 pt（磅），1pt = 1.333px。
  #   13pt ≈ 17.3px，比原来的 14pt(≈18.7px) 小一档；
  #   你 VS Code 里设的 14 是 px，14px ≈ 10.5pt，所以 13pt 仍比编辑器正文略大，属正常。
  style/font_point: 13
  style/label_font_point: 13
  style/comment_font_point: 10                                  # 英文释义比候选词小 3pt

  # 字体名用本机实际注册的族名。
  # 原 weasel.yaml 写的是 "Microsoft YaHei"（不带 UI），但本机枚举不到该族名，
  # 实际族名是 "Microsoft YaHei UI"（msyh.ttc 中注册）。改成正确的名字。
  # font_face 是全局设定，中文和英文共用；注释字体一并统一，避免视觉不一致。
  style/font_face: "Microsoft YaHei UI"
  style/label_font_face: "Microsoft YaHei UI"
  style/comment_font_face: "Microsoft YaHei UI"

  # ─────────── VS Code Dark+ 配色（黑底版）───────────
  # 直接改造现有的 purity_of_form_custom 皮肤（不新建皮肤，改动最小）。
  # 配色方案自身的颜色优先级高于 style/，所以必须在这里覆盖，改 style/ 无效。
  #
  # ⚠️ 数值格式为 0xBBGGRR —— 【蓝色是第一字节】，不是常见的 0xRRGGBB，别搞反。
  #    换算：想要 #RRGGBB，就写成 0xBBGGRR（把红蓝两字节对调）。
  #    例如 #CE9178 → 0x7891CE

  # 候选框背景与边框
  "preset_color_schemes/purity_of_form_custom/back_color": 0x000000        # #000000 纯黑底
  "preset_color_schemes/purity_of_form_custom/border_color": 0x3C3C3C      # #3C3C3C 深灰细边
  "preset_color_schemes/purity_of_form_custom/shadow_color": 0xB4000000    # ARGB 半透明黑阴影

  # 编码行（输入框里正在输入的那串字母）
  "preset_color_schemes/purity_of_form_custom/text_color": 0xFEDC9C        # #9CDCFE 变量蓝
  "preset_color_schemes/purity_of_form_custom/hilited_text_color": 0xFFFFFF # #FFFFFF

  # 候选词：中文白色
  "preset_color_schemes/purity_of_form_custom/candidate_text_color": 0xFFFFFF   # #FFFFFF 白
  "preset_color_schemes/purity_of_form_custom/label_color": 0xC586C0            # #C586C0 关键字紫

  # ★ 选中项高亮：黑底上用中性深灰，避免大面积蓝底压过白字
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_back_color": 0x333333    # #333333
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_border_color": 0x333333  # 与背景同色 → 无边框
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_text_color": 0xFFFFFF     # 白字
  "preset_color_schemes/purity_of_form_custom/hilited_candidate_label_color": 0xFEDC9C   # #9CDCFE 变量蓝

  # ★ 英文释义：橙色（VS Code 字符串色 #CE9178）
  "preset_color_schemes/purity_of_form_custom/comment_text_color": 0x7891CE         # #CE9178 字符串橙
  "preset_color_schemes/purity_of_form_custom/hilited_comment_text_color": 0x7891CE # 选中项同样是橙
  #
  # 对比度实测（WCAG 标准，正文需 ≥4.5:1）：
  #   中文候选 #FFFFFF / #000000 ......... 21.0:1 ✅✅
  #   英文释义 #CE9178 / #000000 .........  9.0:1 ✅✅（原 0x808080 仅 5.3:1 且偏灰闷）
  #   选中项文字 #FFFFFF / #333333 ....... 12.6:1 ✅✅

  # ─────────── 行高与间距（压缩候选行高度）───────────
  # linespacing：字号百分比，正值撑高、负值压缩。这是控制候选行高度的关键项。
  #   0 = 默认；-20 = 行高压缩到约 80%；-45 = 压缩到约 55%（当前值）。
  #   如果运行时出现字体上下跳动，把 style/layout/baseline 一起设成与 linespacing 相近的值。
  style/layout/linespacing: -45

  # candidate_spacing：候选项之间的间距（默认 22，偏大）。
  style/layout/candidate_spacing: 2

  # margin_y：候选框整体的上下内边距（默认 8）。
  style/layout/margin_y: 3

  # ---- 微调备忘（按需改上面的数值，改完记得重新部署）----
  #   想完全恢复默认：把上面三行注释掉
  #   还要更挤：linespacing -60，candidate_spacing 0
  #   挤过头：linespacing -30，candidate_spacing 8

  # ─────────── 托盘状态图标（反映真实的中/英状态）───────────
  # Weasel 默认只靠 Windows 语言栏显示中英状态（任务栏那个「中 / Ａ」）。
  # 但开机后、Rime 还没建立会话之前，语言栏会先显示「中」，敲下第一个键才变成 Ａ，
  # 与 rime_ice.custom.yaml 里 ascii_mode 默认 Ａ 的设置对不上。
  # 打开下面这个图标后，Rime 自己的托盘图标会反映真实状态，不再依赖语言栏的滞后。
  # 注意：这只是多一个显示用的图标，不改变任何输入行为。
  # 想关掉：改成 false，或整行删掉，然后重新部署。
  style/display_tray_icon: true

  # ─── 在特定程序里强制英文模式（按需取消注释）───
  # 程序名一律用小写，含 .exe
  # app_options/pwsh.exe:
  #   ascii_mode: true
  # app_options/nvim-qt.exe:
  #   ascii_mode: true
  #   vim_mode: true                         # vim 模式：Esc / Ctrl+C 自动回到英文
  # app_options/mintty.exe:
  #   ascii_mode: true
