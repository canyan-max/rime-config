# 雾凇拼音 输入方案定制（自定义补丁文件）
# 这是 rime_ice.schema.yaml 的补丁文件，改动不会被升级覆盖。
# 修改后需要「重新部署」才生效：
#   & "D:\Soft\21_rimer_app\weasel-0.17.4\WeaselDeployer.exe" /deploy
#
# 参考：Rime 定制指南
# <https://github.com/rime/home/wiki/CustomizationGuide#一例默認英文輸出>
#
# 写法说明：下面凡是「整表/整块」覆盖的地方，都写成完整内容，而不用 switches/@3 这种按下标改的写法。
# 下标写法在增删条目后会错位（删掉一个开关，后面所有下标全部前移），整表覆盖更安全，
# 而且一眼就能看出实际生效的是什么。

patch:
  # ─────────── 方案开关（F4 方案选单里显示的就是这几个）───────────
  # reset：切换到本方案时重置为指定状态；注释掉 reset 则沿用上次状态（切换窗口不重置）。
  "switches":
    - name: ascii_mode
      states: [ 中, Ａ ]
      # 0 = 中（中文），1 = Ａ（ASCII / 英文）。
      # 这里设为 0：开机后直接是中文，与任务栏指示器开机显示的「中」一致，
      # 不会出现"指示器显示中、实际是英文，头几个字母打出来是英文"的错位。
      # 想改回默认英文：把 0 改成 1。
      reset: 0
    - name: ascii_punct
      states: [ 中文标点, 英文标点 ]
      reset: 1                    # 默认仍用英文标点；Ctrl+Shift+3 可切换中文标点
    - name: full_shape
      states: [ 半角, 全角 ]
      reset: 0                    # 默认半角字符；中文标点由 ascii_punct 独立控制
    - name: dict_comment          # 本仓库新增：中英词典释义开关
      states: [ 译关, 译开 ]
      reset: 1
  # 已移除的开关（F4 菜单里相应项也随之消失）：
  #   traditionalization（简/繁）、emoji（💀/😄）、search_single_char（正常/单字）

  # ─────────── 已关闭、用不上的扩展功能 ───────────
  # 摘掉的都只是「引擎列表里的条目」，对应的文件（lua/*.lua、radical_pinyin.*、opencc/emoji*）
  # 全部原样保留在仓库里。哪天想用回来，把下面注释里写的条目加回对应列表即可。
  # 关闭清单：以词定字、部件拆字反查与辅码、简繁切换、Emoji。

  # 不再把部件拆字方案当作本方案的依赖。
  # 效果：部署时不再编译 radical_pinyin.dict.yaml（约 2 MB 词典 / 5.5 MB 编译产物）。
  "schema/dependencies":
    - melt_eng        # 英文输入，作为次翻译器挂载到拼音方案

  # 不再识别 u 开头的拆字反查。
  # 去掉这条匹配规则后，u 开头的英文单词（use、url…）照常由英文词库出候选，只是不再触发拆字。
  "recognizer":
    import_preset: default                # 从 default.yaml 继承通用的
    patterns:                             # 方案专有的匹配规则
      punct: "^v([0-9]|10|[A-Za-z]+)$"    # 响应 symbols_v.yaml 的 symbols，用 v 替换 /
      unicode: "^U[a-f0-9]+"              # 响应 lua_translator@*unicode
      number: "^R[0-9]+[.]?[0-9]*"        # 响应 lua_translator@*number_translator，数字金额大写
      calculator: "^cC.+"                 # 响应 lua_translator@*calc_translator，计算器
      gregorian_to_lunar: "^N[0-9]{1,8}"  # 响应 lua_translator@*lunar，公历转农历
      base_conversion: "^(hex[0-9a-fA-F]+|dec[0-9]+|bin[01]+)$" # 进制转换
      # 匹配逐键输入的中间状态，避免数字键提前选字；Lua 仅在 min/max 完整时输出。
      numeric_limits: "^[ui](8|1(6)?|3(2)?|6(4)?)(m(a(x)?|i(n)?)?)?$"
      # 已移除：radical_lookup: "^uU[a-z]+$"

  "engine/processors":
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
    # 已移除：lua_processor@*select_character（以词定字，[ ] 键上屏词中单个字）

  "engine/segmentors":
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
    # 已移除：affix_segmentor@radical_lookup（部件拆字自定义 tag）

  "engine/translators":
    - punct_translator
    - script_translator
    - lua_translator@*date_translator    # 时间、日期、星期
    - lua_translator@*lunar              # 农历
    - lua_translator@*uuid               # UUID
    - table_translator@custom_phrase     # 自定义短语 custom_phrase.txt
    - table_translator@melt_eng          # 英文输入
    - table_translator@cn_en             # 中英混合词汇
    - lua_translator@*unicode            # Unicode
    - lua_translator@*number_translator  # 数字、金额大写
    - lua_translator@*calc_translator    # 计算器
    - lua_translator@*base_converter     # 进制转换（最多 64 位整数）
    - lua_translator@*numeric_limits     # 整数边界：十进制、十六进制、C 宏
    - lua_translator@*force_gc           # 暴力 GC
    # 已移除：table_translator@radical_lookup（部件拆字反查）

  "engine/filters":
    - lua_filter@*corrector                         # 错音错字提示
    - lua_filter@*autocap_filter                    # 英文自动大写
    - lua_filter@*v_filter                          # v 模式 symbols 优先
    - lua_filter@*pin_cand_filter                   # 置顶候选项
    - lua_filter@*long_word_filter                  # 长词优先
    - lua_filter@*reduce_english_filter             # 降低部分英语单词在候选项的位置
    - uniquifier                                    # 去重
    - lua_filter@*dict_comment_filter               # 中英词典释义（候选旁显示英文）
    # 已移除：reverse_lookup_filter@radical_reverse_lookup（部件拆字滤镜）
    #         simplifier@emoji（Emoji）
    #         simplifier@traditionalize（简繁切换）
    #         lua_filter@*search@radical_pinyin（部件拆字辅码）

  # ⚠️ 历史教训（保留备查）：不要用 "engine/filters/@10" 这种写法！
  #   实测 `@n` 是「替换第 n 项」而不是「插入」，用它会把当时列表末尾的
  #   `uniquifier`（候选去重滤镜）顶掉，导致重复候选不再合并。
  #   `/+` 是「与列表合并」的语法，只会追加、不会破坏原有内容。
  #   现在释义滤镜直接写在上面那份完整列表的末尾（uniquifier 之后），
  #   好处是不依赖补丁内部的书写顺序：整表覆盖与 `/+` 追加若先后顺序颠倒，
  #   追加的那一条会被整表覆盖顶掉，直接写进列表就没有这个隐患。

  # 词典释义滤镜的详细设置
  dict_comment_filter:
    enable_chinese_to_english: true    # 打中文时，候选旁显示英文释义（CC-CEDICT）
    enable_english_to_chinese: false   # 打英文时显示中文释义：未安装 ecdict 词典，保持关闭
    max_defs: 2                        # 日常简明模式：最多显示两条完整短释义
    max_length: 0                      # 0 表示不截断释义
    brief_length: 40                   # 合计超过此长度就不追加第二条，第一条始终完整
    comment_prefix: " "                # 释义与候选词之间的分隔
    comment_suffix: ""

  # Ctrl+Shift+E 切换释义开关
  "key_binder/bindings/@next":
    when: always
    accept: "Control+Shift+E"
    toggle: dict_comment

  # ─── 其他常用设定（按需取消注释）───
  # "switches/@1/reset": 1        # 默认使用英文标点（ascii_punct）
  # 每页候选数（1~9）已在 default.custom.yaml 里设为 6；如需只对本方案另设，取消下面注释
  # "menu/page_size": 6
