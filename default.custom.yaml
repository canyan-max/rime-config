patch:
  schema_list:
    - {schema: rime_ice}

  # ─────────── 候选词个数 ───────────
  # 每页显示几个候选。上游默认 5，这里改成 6。
  # 取值 1~9：用数字键 1-9 选字；填 10 则会用到数字键 0 选第 10 个。
  # 配合 weasel.custom.yaml 中的字号与间距设置，每页显示 6 个候选。
  "menu/page_size": 6

  # ─────────── 标点符号：使用中文标点（全角样式）───────────
  # 不再覆盖 punctuator；关闭 ascii_punct 后，中文模式使用上游雾凇拼音的标点映射：
  #   半角状态： , → ，   . → 。   ? → ？   ! → ！   ; → ；   : → ：
  #             \ → 、   $ → ¥    ^ → ……   _ → ——   ` → ·
  #             ( ) → （）  [ ] → 【】  { } → 「」  引号 → ‘ ’ “ ”
  #   全角状态： 除上述中文标点外，把 / | ~ @ # % & * - + = 等也输出全角
  # rime_ice.custom.yaml 的 ascii_punct 默认开启，保持原来的英文标点习惯。
  # Ctrl+Shift+3 或 F4 的中英文标点选项可切换；英文输入模式始终输出 ASCII。
  #
  # 如果希望某几个键固定输出 ASCII（例如想打美元符号 $、下划线 _），按需加回即可 ——
  # punctuator 下的字典是「合并」而非替换，未列出的键沿用上游值：
  # punctuator:
  #   half_shape:
  #     '$' : { commit: '$' }      # 不加这行时，中文模式下 $ 输出 ¥
  #     '_' : { commit: '_' }      # 不加这行时，中文模式下 _ 输出 ——
  #
  # v 模式（键盘上的 v 键）仍可用于输入键盘上没有的符号：
  #   《》〈〉「」『』【】〔〕等，映射见 symbols_v.yaml
